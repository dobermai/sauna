name: Release Binaries

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all

  build:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: sauna-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: sauna-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: sauna-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: sauna-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: sauna-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p sauna

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/sauna ${{ matrix.name }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: mv target/${{ matrix.target }}/release/sauna.exe ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download macOS binaries
        run: |
          curl -L -o sauna-macos-x86_64 "https://github.com/dobermai/sauna/releases/download/${{ github.ref_name }}/sauna-macos-x86_64"
          curl -L -o sauna-macos-aarch64 "https://github.com/dobermai/sauna/releases/download/${{ github.ref_name }}/sauna-macos-aarch64"

      - name: Calculate SHA256
        id: sha
        run: |
          echo "x86_64=$(sha256sum sauna-macos-x86_64 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "aarch64=$(sha256sum sauna-macos-aarch64 | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Generate formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          SHA_X86: ${{ steps.sha.outputs.x86_64 }}
          SHA_ARM: ${{ steps.sha.outputs.aarch64 }}
        run: |
          mkdir -p formula
          cat > formula/sauna.rb << FORMULA
          class Sauna < Formula
            desc "CLI tool for controlling Klafs saunas"
            homepage "https://github.com/dobermai/sauna"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_intel do
                url "https://github.com/dobermai/sauna/releases/download/${TAG}/sauna-macos-x86_64"
                sha256 "${SHA_X86}"
              end
              on_arm do
                url "https://github.com/dobermai/sauna/releases/download/${TAG}/sauna-macos-aarch64"
                sha256 "${SHA_ARM}"
              end
            end

            def install
              bin.install stable.url.split("/").last => "sauna"
            end

            test do
              system "#{bin}/sauna", "--version"
            end
          end
          FORMULA

      - name: Push to tap
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        with:
          source-directory: 'formula'
          destination-github-username: 'dobermai'
          destination-repository-name: 'homebrew-tap'
          target-directory: 'Formula'
          target-branch: main
          commit-message: "Update sauna to ${{ steps.version.outputs.version }}"
