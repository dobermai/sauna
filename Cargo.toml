[workspace]
resolver = "2"
members = ["klafs-api", "sauna"]

[workspace.package]
version = "0.1.7"
edition = "2021"
authors = ["Dominik Obermaier <dobermai@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dobermai/sauna"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (rustls for cross-platform builds without OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Credentials storage (apple-native for macOS keychain, linux-native for Linux secret service)
keyring = { version = "3", features = ["apple-native", "linux-native"] }

# Output formatting
colored = "2"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Testing
wiremock = "0.6"

# Local crates
klafs-api = { version = "0.1", path = "klafs-api" }
