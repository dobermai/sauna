[package]
name = "klafs-api"
description = "Rust client library for the Klafs sauna control API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["sauna", "klafs", "iot", "smart-home", "api"]
categories = ["api-bindings", "hardware-support"]

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

# For scraping verification token from HTML
scraper = "0.22"

# Cookie handling
cookie_store = "0.21"

# Lightweight regex for GUID extraction
regex-lite = "0.1"

# URL encoding for form data logging
urlencoding = "2"

# For debug logging
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock.workspace = true
tracing-subscriber.workspace = true
